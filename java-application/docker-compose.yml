version: "3.9"

services:

  db01:
    image: mysql:8.0
    container_name: db01
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: vprodbpass
      MYSQL_DATABASE: accounts

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db_backup.sql:/docker-entrypoint-initdb.d/db_backup.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pvprodbpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  rmq01:
    image: rabbitmq:3-management
    container_name: rmq01
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  mc01:
    image: memcached:1.6
    container_name: mc01
    restart: unless-stopped

    ports:
      - "11211:11211"

    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc localhost 11211 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: vprofile:v1
    container_name: vprofile

    restart: unless-stopped

    depends_on:
      db01:
        condition: service_healthy
      rmq01:
        condition: service_healthy

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  mysql_data: