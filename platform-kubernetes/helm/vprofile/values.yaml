replicaCount: 2

image:
  repository: 274585058347.dkr.ecr.us-east-1.amazonaws.com/enterprise-devsecops-dev-application
  pullPolicy: IfNotPresent
  tag: "v1"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: alb

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi

  limits:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

nodeSelector: {}

tolerations: []

affinity: {}

###########################################################################
# Application Configuration
###########################################################################

config:

  databaseHost: vprofile-mysql
  databasePort: 3306
  databaseName: accounts

  rabbitmqHost: vprofile-rabbitmq
  rabbitmqPort: 5672

  memcachedHost: vprofile-memcached
  memcachedPort: 11211

  elasticsearchHost: vprosearch01
  elasticsearchPort: 9300

  hibernateDialect: org.hibernate.dialect.MySQL8Dialect
  hibernateShowSql: false
  hibernateFormatSql: false
  hibernateHbm2ddl: none

###########################################################################
# Secrets
###########################################################################

secret:

  databaseUsername: root
  databasePassword: vprodbpass

  rabbitmqUsername: guest
  rabbitmqPassword: guest

###########################################################################
# MySQL
###########################################################################

mysql:
  enabled: true

  image:
    repository: mysql
    tag: "8.0"

  database: accounts

  rootUser: root
  rootPassword: vprodbpass

  service:
    name: vprofile-mysql
    port: 3306

  persistence:
    enabled: true
    size: 5Gi

###########################################################################
# RabbitMQ
###########################################################################

rabbitmq:
  enabled: true

  image:
    repository: rabbitmq
    tag: "3-management"

  username: guest
  password: guest

  service:
    name: vprofile-rabbitmq
    amqpPort: 5672
    managementPort: 15672

###########################################################################
# Memcached
###########################################################################

memcached:
  enabled: true

  image:
    repository: memcached
    tag: "1.6"

  service:
    name: vprofile-memcached
    port: 11211